name: Build and scanner tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify runner architecture
        run: test "$(uname -m)" = arm64
      - name: Run scanner and model regressions
        run: ./Tests/run.sh
      - name: Archive security regressions
        run: ./Tests/archive.sh
      - name: Browser lifecycle, tree and sorting tests
        run: ./Tests/browser.sh
      - name: Build and verify app and extensions
        run: ./build.sh
      - name: Markdown security and export tests
        run: ./Tests/content.sh
      - name: Renderer and lifecycle checks
        run: ./Tools/test-renderer.sh
